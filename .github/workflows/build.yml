name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2.3.1
    - uses: cachix/install-nix-action@v12
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Build
      run: nix-build
    - name: Verify TilEm shell bindings
      run: |
        nix --extra-experimental-features 'nix-command flakes' develop -c make build
        nix --extra-experimental-features 'nix-command flakes' develop -c python3 debug/verify_tilem_keybindings.py
