# Project-local TilEm bindings for zkeme80's alpha-default text input.
#
# Stock TilEm treats lowercase letters as calculator shortcuts (for example,
# "s" presses SIN).  zkeme80 interprets the physical SIN key by its alpha
# legend, E, so stock bindings are surprising in the interactive shell.  Map
# host letters directly to the physical keys carrying matching alpha legends.

[ti84p]
Up             = Up
Down           = Down
Left           = Left
Right          = Right
KP_Up          = Up
KP_Down        = Down
KP_Left        = Left
KP_Right       = Right
Tab            = 2nd
KP_Tab         = 2nd
ISO_Left_Tab   = 2nd
Delete         = Del
KP_Delete      = Del
BackSpace      = Del
Escape         = Clear
Return         = Enter
KP_Enter       = Enter
ISO_Enter      = Enter
F12            = On

a = Math
b = Apps
c = Prgm
d = Recip
e = Sin
f = Cos
g = Tan
h = Power
i = Square
j = Comma
k = LParen
l = RParen
m = Div
n = Log
o = 7
p = 8
q = 9
r = Mul
s = Ln
t = 4
u = 5
v = 6
w = Sub
x = Store
y = 1
z = 2

